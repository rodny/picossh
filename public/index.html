    <symbol id="i-up" viewBox="0 0 24 24"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></symbol>
    <symbol id="i-drag" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></symbol>
    <symbol id="i-double-up" viewBox="0 0 24 24"><path d="M6 17.59 7.41 19 12 14.42 16.59 19 18 17.59l-6-6z"/><path d="m6 11 1.41 1.41L12 7.83l4.59 4.58L18 11l-6-6z"/></symbol>
    <symbol id="i-double-down" viewBox="0 0 24 24"><path d="M18 6.41 16.59 5 12 9.58 7.41 5 6 6.41l6 6z"/><path d="m18 13-1.41-1.41L12 16.17l-4.59-4.58L6 13l6 6z"/></symbol>
    <symbol id="i-lan" viewBox="0 0 24 24"><path d="M13 22h8v-7h-3v-4h-5V9h3V2H8v7h3v2H6v4H3v7h8v-7H8v-2h8v2h-3z"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></symbol>
    <symbol id="i-keyboard-hide" viewBox="0 0 24 24"><path d="M20 3H4c-1.1 0-1.99.9-1.99 2L2 15c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 3h2v2h-2V6zm0 3h2v2h-2V9zM8 6h2v2H8V6zm0 3h2v2H8V9zm-1 2H5V9h2v2zm0-3H5V6h2v2zm9 7H8v-2h8v2zm0-4h-2V9h2v2zm0-3h-2V6h2v2zm3 3h-2V9h2v2zm0-3h-2V6h2v2zm-7 15 4-4H8l4 4z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
    <!-- Find toggles, drawn as text like VS Code's: match case, whole word, regular expression, preserve case. -->
    <symbol id="i-match-case" viewBox="0 0 24 24"><text x="12" y="16.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Aa</text></symbol>
    <symbol id="i-match-word" viewBox="0 0 24 24"><text x="12" y="14.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">ab</text><path d="M3 16h2v2h14v-2h2v4H3z"/></symbol>
    <symbol id="i-regex" viewBox="0 0 24 24"><rect x="4" y="15" width="4.5" height="4.5" rx="1"/><g transform="translate(15.5 9)"><rect x="-1" y="-5.5" width="2" height="11" rx=".5"/><rect x="-1" y="-5.5" width="2" height="11" rx=".5" transform="rotate(60)"/><rect x="-1" y="-5.5" width="2" height="11" rx=".5" transform="rotate(-60)"/></g></symbol>
    <symbol id="i-tune" viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></symbol>

  </svg>
  <div id="app">
    <section id="view-loading" class="view active" aria-busy="true">
      <div class="spinner big"></div>
    </section>

    <section id="view-login" class="view">
      <form id="login-form" class="login" autocomplete="on">
        <img src="/icon.svg" alt="" class="login-icon" width="72" height="72">
        <h1>picossh</h1>
        <button type="button" id="login-passkey" class="btn primary block" hidden>Sign in with Face ID</button>
        <div id="login-or" class="or" hidden><span>or</span></div>
        <input type="text" name="username" value="picossh" autocomplete="username" hidden>
        <input type="password" id="login-password" name="password" class="input" placeholder="App password" autocomplete="current-password" required>
        <button type="submit" id="login-submit" class="btn block">Sign in</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="view-home" class="view">
      <header class="topbar">
        <button type="button" id="home-back" class="icon-btn" aria-label="Back to Settings" hidden><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        <h1 id="home-title">Servers</h1>
        <button type="button" id="home-refresh" class="icon-btn" aria-label="Refresh" title="Refresh" hidden><svg class="icon" aria-hidden="true"><use href="#i-refresh-filled"/></svg></button>
        <button type="button" id="home-add" class="icon-btn" aria-label="Add"><svg class="icon" aria-hidden="true"><use href="#i-add"/></svg></button>
      </header>
      <main class="scroll">
        <div id="tab-servers" class="tab active"></div>
        <div id="tab-connections" class="tab"></div>
        <div id="tab-snippets" class="tab"></div>
        <div id="tab-keys" class="tab"></div>
        <div id="tab-settings" class="tab"></div>
      </main>
      <nav class="tabbar" id="home-tabs">
        <button type="button" data-tab="servers" class="active"><span class="tab-pill"><svg class="icon" aria-hidden="true"><use href="#i-dns"/></svg>Servers</span></button>
        <button type="button" data-tab="connections"><span class="tab-pill"><svg class="icon" aria-hidden="true"><use href="#i-lan"/></svg>Connections</span></button>
        <button type="button" data-tab="keys"><span class="tab-pill"><svg class="icon" aria-hidden="true"><use href="#i-key"/></svg>SSH Keys</span></button>
        <button type="button" data-tab="settings"><span class="tab-pill"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>Settings</span></button>
      </nav>
    </section>

    <section id="view-session" class="view">
      <header class="topbar" id="session-topbar">
        <button type="button" id="session-back" class="icon-btn" aria-label="Back to connections"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        <button type="button" id="session-settings" class="topbar-title" aria-label="Connection settings"><span id="session-status" class="dot"></span><span id="session-title"></span></button>
        <button type="button" id="session-close" class="text-btn danger">Disconnect</button>
      </header>
      <!-- On the Files panel: back goes to the folder before this one, then to the Terminal. -->
      <header class="topbar" id="files-topbar" hidden>
        <button type="button" id="files-back" class="icon-btn back-btn" aria-label="Back to Terminal"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span id="files-back-label">Terminal</span></button>
        <button type="button" id="files-title" class="topbar-title" aria-label="Go to folder"><span id="files-folder"></span></button>
        <button type="button" id="files-star" class="icon-btn" aria-pressed="false" aria-label="Add to favorites" title="Add to favorites"><svg class="icon" aria-hidden="true"><use href="#i-star-outline"/></svg></button>
      </header>
      <main class="session-main">
        <div id="panel-terminal" class="panel active">
          <div id="terminals"></div>
          <div id="keybar" class="keybar"></div>
          <div id="mobile-keyboard" class="mobile-keyboard" hidden aria-label="Terminal keyboard"></div>
        </div>
        <div id="panel-files" class="panel">
          <div class="files-toolbar">
            <button type="button" class="tool" data-files="upload" aria-label="Upload" title="Upload"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg></button>
            <button type="button" class="tool" data-files="newfile" aria-label="New file" title="New file"><svg class="icon" aria-hidden="true"><use href="#i-note-add"/></svg></button>
            <button type="button" class="tool" data-files="mkdir" aria-label="New folder" title="New folder"><svg class="icon" aria-hidden="true"><use href="#i-new-folder"/></svg></button>
            <button type="button" class="tool" data-files="zip" aria-label="Download as zip" title="Download as zip"><svg class="icon" aria-hidden="true"><use href="#i-file-zip"/></svg></button>
            <button type="button" class="tool" data-files="hidden" aria-pressed="false" aria-label="Show hidden files" title="Show hidden files"><svg class="icon" aria-hidden="true"><use href="#i-visibility-off"/></svg></button>
            <button type="button" class="tool tool-end" data-files="refresh" aria-label="Refresh" title="Refresh"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
          </div>
          <div id="files-crumbs" class="crumbs"></div>
          <div id="files-progress" class="progress" hidden><div class="progress-bar"></div><span class="progress-text"></span></div>
          <div id="files-list" class="file-list"></div>
          <input type="file" id="files-input" multiple hidden>
        </div>
      </main>
      <nav class="tabbar" id="session-tabs">
        <button type="button" data-panel="terminal" class="active"><span class="tab-pill"><svg class="icon" aria-hidden="true"><use href="#i-terminal"/></svg>Terminal</span></button>
        <button type="button" data-panel="files"><span class="tab-pill"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>Files</span></button>
      </nav>
    </section>

    <section id="view-editor" class="view">
      <header class="topbar">
        <button type="button" id="editor-back" class="icon-btn" aria-label="Close file"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        <button type="button" id="editor-discard" class="icon-btn" aria-label="Discard changes" title="Discard changes" hidden><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
        <div class="topbar-title"><span id="editor-dirty" class="dot dirty" title="Unsaved changes" hidden></span><span id="editor-name"></span></div>
        <button type="button" id="editor-edit" class="text-btn">Edit</button>
        <button type="button" id="editor-save" class="round-btn primary" aria-label="Save" title="Save" hidden><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg></button>
      </header>
      <div class="files-toolbar editor-toolbar">
        <button type="button" class="tool" data-editor="find" aria-pressed="false" aria-label="Find" title="Find (Ctrl+F)"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg></button>
        <button type="button" class="tool" data-editor="wrap" aria-pressed="false" aria-label="Wrap lines" title="Wrap lines"><svg class="icon" aria-hidden="true"><use href="#i-wrap"/></svg></button>
        <button type="button" class="tool" data-editor="lines" aria-pressed="true" aria-label="Line numbers" title="Line numbers"><svg class="icon" aria-hidden="true"><use href="#i-line-numbers"/></svg></button>
        <button type="button" class="tool" data-editor="indent" hidden aria-label="Indent" title="Indent"><svg class="icon" aria-hidden="true"><use href="#i-indent"/></svg></button>
        <button type="button" class="tool" data-editor="outdent" hidden aria-label="Outdent" title="Outdent"><svg class="icon" aria-hidden="true"><use href="#i-outdent"/></svg></button>
        <select id="editor-language" class="tool tool-select" aria-label="Syntax" title="Syntax"><option value="auto">Auto-detect</option></select>
        <select id="editor-indent" class="tool tool-select" aria-label="Indentation" title="Indentation">
          <option value="tab-2">Tabs: 2</option><option value="tab-4">Tabs: 4</option><option value="tab-8">Tabs: 8</option>
          <option value="space-2">Spaces: 2</option><option value="space-4">Spaces: 4</option><option value="space-8">Spaces: 8</option>
        </select>
        <button type="button" class="tool tool-end" data-editor="reload" aria-label="Reload from server" title="Reload from server"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
      </div>
      <div id="editor-find" class="find-bar" hidden>
        <div class="find-row">
          <button type="button" class="find-btn find-expand" data-editor="toggle-replace" aria-expanded="false" aria-label="Toggle replace" title="Toggle Replace (Ctrl+H)"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right-line"/></svg></button>
          <div class="find-field">
            <input type="search" id="editor-find-input" class="find-input" placeholder="Find" aria-label="Find" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="search">
            <span id="editor-find-count" class="find-count" aria-live="polite"></span>
          </div>
          <div class="find-options-wrap">
            <button type="button" class="find-btn find-options-toggle" data-editor="find-options" aria-haspopup="true" aria-expanded="false" aria-controls="editor-find-options" aria-label="Search options" title="Search options"><svg class="icon" aria-hidden="true"><use href="#i-tune-line"/></svg></button>
            <div id="editor-find-options" class="find-options" role="group" aria-label="Search options">
              <button type="button" class="find-btn" data-editor="opt-case" aria-pressed="false" aria-label="Match case" title="Match Case (Alt+C)"><svg class="icon" aria-hidden="true"><use href="#i-match-case"/></svg></button>
              <button type="button" class="find-btn" data-editor="opt-word" aria-pressed="false" aria-label="Match whole word" title="Match Whole Word (Alt+W)"><svg class="icon" aria-hidden="true"><use href="#i-match-word"/></svg></button>
              <button type="button" class="find-btn" data-editor="opt-regex" aria-pressed="false" aria-label="Use regular expression" title="Use Regular Expression (Alt+R)"><svg class="icon" aria-hidden="true"><use href="#i-regex"/></svg></button>
            </div>
          </div>
          <button type="button" class="find-btn" data-editor="prev" aria-label="Previous match" title="Previous Match (Shift+Enter)"><svg class="icon" aria-hidden="true"><use href="#i-up-line"/></svg></button>
          <button type="button" class="find-btn" data-editor="next" aria-label="Next match" title="Next Match (Enter)"><svg class="icon" aria-hidden="true"><use href="#i-down-line"/></svg></button>
          <button type="button" class="find-btn" data-editor="close-find" aria-label="Close find" title="Close (Escape)"><svg class="icon" aria-hidden="true"><use href="#i-close-line"/></svg></button>
        </div>
        <div id="editor-replace-row" class="find-row replace-row" hidden>
          <div class="find-field">
            <input type="text" id="editor-replace-input" class="find-input" placeholder="Replace" aria-label="Replace" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="done">
          </div>
          <button type="button" class="find-btn" data-editor="opt-preserve" aria-pressed="false" aria-label="Preserve case" title="Preserve Case (Alt+P)"><svg class="icon" aria-hidden="true"><use href="#i-preserve-case"/></svg></button>
          <button type="button" class="find-text-btn" data-editor="replace-one" title="Replace (Enter)">Replace</button>
          <button type="button" class="find-text-btn" data-editor="replace-all" title="Replace All (Ctrl+Alt+Enter)">All</button>
        </div>
      </div>
      <main id="editor-main" class="editor-main"></main>
      <footer id="editor-status" class="editor-status"></footer>
    </section>

    <section id="view-lock" class="view lock">
      <div class="login">
        <img src="/icon.svg" alt="" class="login-icon" width="72" height="72">
        <h1>Locked</h1>
        <button type="button" id="lock-unlock" class="btn primary block">Unlock with Face ID</button>
        <button type="button" id="lock-signout" class="btn block">Sign out</button>
        <p id="lock-error" class="error" role="alert"></p>
      </div>
    </section>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-webgl.js"></script>
  <script src="/phone-terminal.js"></script>
  <script src="/terminal-mouse.js"></script>
  <script src="/keyboard.js"></script>
  <script src="/mobile-keyboard.js"></script>
  <script src="/text-search.js"></script>
  <script src="/shell-highlight.js"></script>
  <script src="/markdown-links.js"></script>
  <script src="/editor.js"></script>
  <script src="/large-file.js"></script>
  <script src="/app.js"></script>
</body>
</html>
